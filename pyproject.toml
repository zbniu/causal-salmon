[project]
name = "causal-salmon"
version = "0.1.0"
description = "Offline calibration for the frozen Causal Salmon tutoring study"
requires-python = "==3.12.*"
dependencies = ["numpy==2.5.3"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
